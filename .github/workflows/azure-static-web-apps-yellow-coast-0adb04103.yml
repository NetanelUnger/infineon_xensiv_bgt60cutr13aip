name: Deploy Radar web to Azure

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/azure-static-web-apps-yellow-coast-0adb04103.yml'

permissions:
  contents: read

concurrency:
  group: azure-radar-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Deploy static web files
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: web
          submodules: false
          lfs: false
          persist-credentials: false
      - name: Deploy web only
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_COAST_0ADB04103 }}
          action: upload
          app_location: web
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
